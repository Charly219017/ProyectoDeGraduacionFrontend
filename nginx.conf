server {
    listen 80;
    server_name localhost;

    # Oculta la versión de Nginx en las cabeceras de respuesta
    server_tokens off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # --- Cabeceras de Seguridad ---
        # Previene que la página sea cargada en un iframe desde otros dominios (Clickjacking)
        add_header X-Frame-Options "SAMEORIGIN";

        # Evita que el navegador interprete archivos con un tipo MIME incorrecto
        add_header X-Content-Type-Options "nosniff";

        # Activa la protección contra XSS en navegadores antiguos
        add_header X-XSS-Protection "1; mode=block";

        # Política de Seguridad de Contenido (CSP)
        # Restringe los recursos (scripts, estilos, etc.) a 'self' (el propio dominio)
        # Es una configuración básica. Puede que necesites ajustarla si usas CDNs o APIs externas.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'self';";
    }

    # Configuración de tipos MIME
    include /etc/nginx/mime.types;
}
